; ============================================================================
; تَوان | Tavaan — پروفایل «ایده‌آل» هاست اشتراکی (Shared Hosting — Ideal)
; DOC-134 §4.2 — تنظیم پیشنهادی رسمی تَوان برای پلن‌های میان‌رده
;
; فرض: cPanel/DirectAdmin با امکان ویرایش php.ini (MultiPHP INI Editor)،
; OPcache فعال، MySQL/MariaDB، SSH محدود (برای tvn migrate / tvn optimize).
; ============================================================================

; ── منابع درخواست ───────────────────────────────────────────────────────────
memory_limit = 256M              ; HTTP ~۶MB (۴۰× حاشیه) + گزارش/ایمپورت تا ~۱۰۰k رکورد (DOC-134 §5.2/§5.3)
max_execution_time = 120         ; مهاجرت‌ها/ایمپورت CSV از طریق وب تا این سقف مجاز
max_input_time = 60
max_input_vars = 5000
max_input_nesting_level = 64

; ── آپلود ────────────────────────────────────────────────────────────────────
upload_max_filesize = 32M        ; هم‌راستا با media.upload_max پیش‌فرض کیت‌ها
post_max_size = 35M

; ── OPcache (تنظیم بهینهٔ اندازه‌گیری‌شده) ────────────────────────────────────
opcache.enable = 1
opcache.memory_consumption = 128         ; footprint ~۲۲MB + رشد ماژول/کیت/پلاگین کاربر (DOC-134 §4.5)
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000    ; 8 کیت + ماژول‌ها + پلاگین‌های کاربر
opcache.validate_timestamps = 0          ; 🔒 production: کد ثابت → صفر stat() — پس از هر دیپلوی reset
opcache.revalidate_freq = 0
opcache.save_comments = 1                ; ⚠️ لازم — هرگز 0 نکنید
opcache.enable_file_override = 0

; ── Preload (اگر هاست اجازهٔ opcache.preload داد — نمونه: examples/hosting/preload.php) ──
; opcache.preload = /home/USER/tavaan/examples/hosting/preload.php
; opcache.preload_user = USER   ; ⚠️ الزامی — بدون آن PHP preload را رد می‌کند (به‌عنوان root هم اجرا نمی‌شود)

; ── کش مسیر واقعی ────────────────────────────────────────────────────────────
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; ── خطاها و امنیت ────────────────────────────────────────────────────────────
display_errors = Off
log_errors = On
error_log = /home/USER/tavaan/storage/logs/php-error.log
expose_php = Off
session.cookie_httponly = 1
session.cookie_secure = 1          ; فقط اگر HTTPS قطعی است
session.cookie_samesite = Lax
session.use_strict_mode = 1

date.timezone = Asia/Tehran
