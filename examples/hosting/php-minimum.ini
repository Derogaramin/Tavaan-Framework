; ============================================================================
; تَوان | Tavaan — پروفایل «حداقل» هاست اشتراکی (Shared Hosting — Minimum)
; DOC-134 §4.1 — معادل سطح minimum وردپرس/لاراول در صورت‌مسئله
;
; هدف: اجرای صحیح فریمورک روی ارزان‌ترین پلن اشتراکی (cPanel/DirectAdmin،
; وب‌سرور LiteSpeed/Apache + PHP-FPM یا lsapi، MySQL اشتراکی، بدون SSH دائم).
;
; نکته: در هاست اشتراکی فقط دستورهای PHP_INI_PERDIR/PHP_INI_USER از طریق
; .user.ini یا «MultiPHP INI Editor» قابل تنظیم‌اند (memory_limit،
; upload_max_filesize، max_execution_time، …). دستورهای opcache.* معمولاً
; PHP_INI_SYSTEM‌اند — اگر هاست اجازه نداد، مقادیر پیش‌فرض پنل اعمال می‌شود.
; ============================================================================

; ── منابع درخواست ───────────────────────────────────────────────────────────
memory_limit = 128M              ; هر درخواست وب تَوان ~۴–۶MB heap + RSS ورکر ~۳۷MB (DOC-134 §5.1/§4.5) → ۲۰× حاشیه
max_execution_time = 60          ; صفحه‌ساز سنگین (BPMS/ERP) حداکثر ~2s
max_input_time = 60
max_input_vars = 3000            ; فرم‌ساز پویا BPMS + فرم‌های چندبخشی ERP
max_input_nesting_level = 64

; ── آپلود (هم‌راستا با http.max_body_size=8M و media.upload_max) ────────────
upload_max_filesize = 8M
post_max_size = 10M              ; کمی بزرگ‌تر از upload — چندفایلی + سربار فرم

; ── OPcache (اگر پنل اجازه دهد) ─────────────────────────────────────────────
opcache.enable = 1
opcache.memory_consumption = 64          ; footprint واقعی تَوان در SHM: ~۱۳MB (DOC-134 §4.5) → ۵× حاشیه
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000    ; کل فایل‌های PHP ریپو: ~2400 — با حاشیهٔ امن
opcache.validate_timestamps = 1          ; در حداقل، امنیتِ «دیپلوی بدون reload» اولویت دارد
opcache.revalidate_freq = 2
opcache.save_comments = 1                ; ⚠️ لازم — DI/داکیومنت‌ها به docblock تکیه دارند
opcache.enable_file_override = 0

; ── کش مسیر واقعی (stat() کمتری — حیاتی برای autoload بدون classmap) ────────
realpath_cache_size = 1024K
realpath_cache_ttl = 120

; ── خطاها و امنیت (production) ──────────────────────────────────────────────
display_errors = Off
log_errors = On
expose_php = Off
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

; ── منطقهٔ زمانی (تَوان با JalaliEngine کار می‌کند؛ هر دو مجاز) ────────────
date.timezone = Asia/Tehran
