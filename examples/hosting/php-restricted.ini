; ============================================================================
; تَوان | Tavaan — واریانت «هاست اشتراکی محدود» (Hardened / Restricted)
; DOC-134 §3.4/§6 — شبیه‌سازی بدترین حالت واقعی: میزبانی که تابع‌های فرآیندی
; و محیطی را با disable_functions بسته است (بسیار رایج در اشتراکی‌های ایران).
;
; این فایل روی پروفایل ideal سوار می‌شود (php -c فقط یک ini می‌پذیرد، پس
; در تست‌ها با -d ترکیب می‌شود). هدف: اثبات سازگاری تَوان با محدودیت‌ها.
; ============================================================================

; تابع‌هایی که در HTTP runtime تَوان «ممکن» است بسته باشند:
;   proc_open/exec/… → فقط ابزارهای dev (test/lint/bench) و queue:listen و
;                      sendmail و schedule نیاز دارند؛ مسیر وب به هیچ‌کدام
;                      وابستگی سخت ندارد (DOC-134 §6 — تست‌شده ✅).
;   putenv           → تَوان هرگز putenv نمی‌زند (DOC-027: بدون putenv) ✅
;   symlink          → فقط backup ممکن است استفاده کند (fallback دارد)
disable_functions = pcntl_alarm,pcntl_fork,pcntl_waitpid,pcntl_wait,pcntl_signal,proc_open,popen,shell_exec,exec,passthru,system,putenv,symlink

; برخی میزبان‌ها open_basedir هم می‌گذارند — تَوان فقط زیر درخت پروژه +
; storage/temp + sys_get_temp_dir را لمس می‌کند:
; open_basedir = /home/USER/tavaan:/tmp

memory_limit = 256M
max_execution_time = 120
upload_max_filesize = 32M
post_max_size = 35M
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
realpath_cache_size = 4096K
realpath_cache_ttl = 600
display_errors = Off
log_errors = On
expose_php = Off
date.timezone = Asia/Tehran
