; ============================================================================
; تَوان | Tavaan — پروفایل «سنگین» هاست اشتراکی (Shared Hosting — Heavy)
; DOC-134 §4.3 — برای سایت‌های پربازدید روی پلن اشتراکی قوی / نیمه‌اختصاصی،
; یا پردازش‌های سنگین (ایمپورت بزرگ، گزارش‌گیری ERP، BPMS با حجم بالا).
;
; ⚠️ در هاست اشتراکی، memory_limit بیش از سهمیهٔ پلن معمولاً توسط میزبان
; بازمی‌گردد (LiteSpeed سقف سخت دارد). مقادیر زیر «سقف منطقی» هستند.
; ============================================================================

; ── منابع درخواست ───────────────────────────────────────────────────────────
memory_limit = 512M              ; گزارش ۱۵۰k+ ردیف / ایمپورت بزرگ؛ HTTP معمول ~۶MB می‌ماند (DOC-134 §5.2/§5.3)
max_execution_time = 300         ; ایمپورت CSV بزرگ، گزارش‌های ERP، backup
max_input_time = 300
max_input_vars = 10000           ; فرم‌ساز BPMS با فرم‌های بزرگ + جداول editable ERP
max_input_nesting_level = 64

; ── آپلود ────────────────────────────────────────────────────────────────────
upload_max_filesize = 64M
post_max_size = 72M

; ── OPcache ──────────────────────────────────────────────────────────────────
opcache.enable = 1
opcache.enable_cli = 0           ; 🔒 در اشتراکی 0 بماند: cron/queue هر بار کش را پر نمی‌کند
opcache.memory_consumption = 256 ; footprint ~۳۹MB + همهٔ کیت/پلاگین + اینترن‌شدها (DOC-134 §4.5)
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 40000
opcache.validate_timestamps = 0  ; 🔒 دیپلوی = آپلود + `tvn optimize` + reset opcache از پنل
opcache.revalidate_freq = 0
opcache.save_comments = 1        ; ⚠️ لازم — هرگز 0 نکنید (برخلاف سمفونی، DI تَوان docblock-محور است)
opcache.enable_file_override = 0

; ── Preload (اختیاری — نیازمند دسترسی به php.ini اصلی و reload سرویس) ──────
; opcache.preload = /home/USER/tavaan/examples/hosting/preload.php
; opcache.preload_user = USER   ; ⚠️ الزامی — بدون آن PHP preload را رد می‌کند (به‌عنوان root هم اجرا نمی‌شود)

; ── کش مسیر واقعی ────────────────────────────────────────────────────────────
realpath_cache_size = 8192K
realpath_cache_ttl = 3600

; ── خطاها و امنیت ────────────────────────────────────────────────────────────
display_errors = Off
log_errors = On
error_log = /home/USER/tavaan/storage/logs/php-error.log
expose_php = Off
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.gc_probability = 0       ; 🔒 در اشتراکی cron تَوان (schedule:run) GC را مدیریت می‌کند

date.timezone = Asia/Tehran
